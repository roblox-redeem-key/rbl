<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пополнение баланса</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
        }
        .input-field {
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }
        .btn-primary {
            background: linear-gradient(45deg, #3b82f6, #6366f1);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        .success-message {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-wallet text-blue-500 text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Пополнение баланса</h1>
            <p class="text-gray-600">Введите данные для пополнения вашего счёта</p>
        </div>

        <form id="paymentForm" class="space-y-6">
            <div>
                <label for="login" class="block text-sm font-medium text-gray-700 mb-2">Ваш логин</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <input 
                        type="text" 
                        id="login" 
                        class="input-field w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                        placeholder="example123"
                        required
                    >
                </div>
            </div>

            <div>
                <label for="code" class="block text-sm font-medium text-gray-700 mb-2">Код пополнения</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-gift text-gray-400"></i>
                    </div>
                    <input 
                        type="text" 
                        id="code" 
                        class="input-field w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                        placeholder="XXXX-XXXX-XXXX"
                        required
                    >
                </div>
            </div>

            <div id="successMessage" class="success-message hidden">
                <div class="bg-green-50 border border-green-200 rounded-xl p-6 text-center">
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-check text-green-500"></i>
                    </div>
                    <h3 class="text-lg font-medium text-green-800 mb-1">Пополнение успешно завершено!</h3>
                    <p class="text-green-600">Средства зачислятся через 4 дня.</p>
                </div>
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="btn-primary w-full text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center"
            >
                <i class="fas fa-paper-plane mr-2"></i> Пополнить
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
            <p>Нет кода пополнения? <a href="#" class="text-blue-500 hover:underline">Приобрести код</a></p>
        </div>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            
            // Показываем состояние загрузки
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Обработка...';
            submitBtn.disabled = true;
            
            // Имитируем запрос к серверу
            setTimeout(() => {
                // Показываем сообщение об успехе
                document.getElementById('successMessage').classList.remove('hidden');
                
                // Очищаем форму
                this.reset();
                
                // Восстанавливаем кнопку
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                
                // Плавно прокручиваем к сообщению
                document.getElementById('successMessage').scrollIntoView({
                    behavior: 'smooth'
                });
            }, 2000);
        });
    </script>

</html>
